<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180" width="1200" height="1180" role="img" aria-label="PaperTrail architecture and run flow">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#2563eb"/>
    </marker>
    <pattern id="grid2" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="1180" fill="#0d0d0d"/>
  <rect width="1200" height="1180" fill="url(#grid2)"/>

  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="60" y="56" font-size="12" fill="#6e6e6e" letter-spacing="3.4">HOW A RUN FLOWS</text>
    <text x="60" y="92" font-family="Georgia, serif" font-size="30" fill="#f2f2f2">One paper in. An auditable record out.</text>
  </g>

  <!-- 0 upload -->
  <g transform="translate(470 130)">
    <rect width="260" height="52" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="130" y="32" font-family="ui-monospace, monospace" font-size="12.5" fill="#d4d4d4" text-anchor="middle" letter-spacing="2">PDF UPLOAD</text>
  </g>
  <line x1="600" y1="182" x2="600" y2="214" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 1 ingest -->
  <g transform="translate(400 214)">
    <rect width="400" height="78" fill="#151515" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="18" y="26" font-family="ui-monospace, monospace" font-size="10.5" fill="#6e6e6e" letter-spacing="2.4">01 — READING THE PAPER</text>
    <text x="18" y="50" font-family="Georgia, serif" font-size="17" fill="#f2f2f2">Azure Document Intelligence</text>
    <text x="18" y="68" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d7d7d">no model call · keeps page + position on every block</text>
  </g>
  <line x1="600" y1="292" x2="600" y2="324" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 2 claims -->
  <g transform="translate(400 324)">
    <rect width="400" height="70" fill="#151515" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="18" y="26" font-family="ui-monospace, monospace" font-size="10.5" fill="#6e6e6e" letter-spacing="2.4">02 — FINDING CLAIMS</text>
    <text x="18" y="50" font-family="Georgia, serif" font-size="17" fill="#f2f2f2">claim-finder</text>
    <text x="330" y="50" font-family="ui-monospace, monospace" font-size="11" fill="#2563eb" text-anchor="end">1 agent</text>
  </g>

  <!-- fan out -->
  <path d="M600 394 v26 H150 v28" fill="none" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M600 394 v26 H450 v28" fill="none" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M600 394 v26 H750 v28" fill="none" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M600 394 v26 H1050 v28" fill="none" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <text x="600" y="414" font-family="ui-monospace, monospace" font-size="10" fill="#6e6e6e" text-anchor="middle" letter-spacing="2">FOUR LANES RUN AT ONCE</text>

  <!-- lanes -->
  <g transform="translate(60 448)">
    <rect width="180" height="180" fill="#151515" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="16" y="26" font-family="ui-monospace, monospace" font-size="10.5" fill="#6e6e6e" letter-spacing="2">GATHER PAPERS</text>
    <text x="16" y="52" font-family="Georgia, serif" font-size="15" fill="#f2f2f2">search-planner</text>
    <text x="16" y="74" font-family="Georgia, serif" font-size="15" fill="#f2f2f2">paper-picker</text>
    <line x1="16" y1="94" x2="164" y2="94" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="16" y="118" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d7d7d">finds 2–10 related</text>
    <text x="16" y="136" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d7d7d">papers to compare</text>
    <text x="164" y="164" font-family="ui-monospace, monospace" font-size="11" fill="#2563eb" text-anchor="end">2 agents</text>
  </g>

  <g transform="translate(360 448)">
    <rect width="180" height="180" fill="#151515" stroke="#2563eb" stroke-opacity="0.4"/>
    <text x="16" y="26" font-family="ui-monospace, monospace" font-size="10.5" fill="#6e6e6e" letter-spacing="2">CITATIONS</text>
    <text x="16" y="52" font-family="Georgia, serif" font-size="15" fill="#f2f2f2">source-finder</text>
    <text x="16" y="74" font-family="Georgia, serif" font-size="15" fill="#f2f2f2">challenger ⇄ supporter</text>
    <text x="16" y="96" font-family="Georgia, serif" font-size="15" fill="#f2f2f2">judge · tracer</text>
    <line x1="16" y1="114" x2="164" y2="114" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="16" y="136" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d7d7d">two blind arguments,</text>
    <text x="16" y="152" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d7d7d">then a verdict</text>
    <text x="164" y="170" font-family="ui-monospace, monospace" font-size="11" fill="#2563eb" text-anchor="end">5 agents</text>
  </g>

  <g transform="translate(660 448)">
    <rect width="180" height="180" fill="#151515" stroke="#2563eb" stroke-opacity="0.4"/>
    <text x="16" y="26" font-family="ui-monospace, monospace" font-size="10.5" fill="#6e6e6e" letter-spacing="2">NUMBERS</text>
    <text x="16" y="52" font-family="Georgia, serif" font-size="15" fill="#f2f2f2">reader one ∥ two</text>
    <text x="16" y="74" font-family="Georgia, serif" font-size="15" fill="#f2f2f2">number-judge</text>
    <line x1="16" y1="94" x2="164" y2="94" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="16" y="118" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d7d7d">extracted twice, blind,</text>
    <text x="16" y="136" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d7d7d">agreement reported</text>
    <text x="164" y="164" font-family="ui-monospace, monospace" font-size="11" fill="#2563eb" text-anchor="end">3 agents</text>
  </g>

  <g transform="translate(960 448)">
    <rect width="180" height="180" fill="#151515" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="16" y="26" font-family="ui-monospace, monospace" font-size="10.5" fill="#6e6e6e" letter-spacing="2">METHODS</text>
    <text x="16" y="52" font-family="Georgia, serif" font-size="15" fill="#f2f2f2">method-writer</text>
    <text x="16" y="74" font-family="Georgia, serif" font-size="15" fill="#f2f2f2">method-checker</text>
    <line x1="16" y1="94" x2="164" y2="94" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="16" y="118" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d7d7d">what is missing to</text>
    <text x="16" y="136" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d7d7d">repeat the work</text>
    <text x="164" y="164" font-family="ui-monospace, monospace" font-size="11" fill="#2563eb" text-anchor="end">2 agents</text>
  </g>

  <!-- join -->
  <path d="M150 628 v30 H600 v26" fill="none" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M450 628 v30 H600" fill="none" stroke="#5a5a5a" stroke-width="1.4"/>
  <path d="M750 628 v30 H600" fill="none" stroke="#5a5a5a" stroke-width="1.4"/>
  <path d="M1050 628 v30 H600" fill="none" stroke="#5a5a5a" stroke-width="1.4"/>

  <!-- ledger -->
  <g transform="translate(370 684)">
    <rect width="460" height="72" fill="#101820" stroke="#2563eb" stroke-opacity="0.55"/>
    <text x="18" y="27" font-family="ui-monospace, monospace" font-size="10.5" fill="#2563eb" letter-spacing="2.4">THE EVIDENCE LEDGER</text>
    <text x="18" y="50" font-family="Georgia, serif" font-size="16" fill="#f2f2f2">Typed records, never prose</text>
    <text x="18" y="66" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d7d7d">merge reducers let all four lanes write at once</text>
  </g>
  <line x1="600" y1="756" x2="600" y2="786" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowBlue)"/>

  <!-- conflicts -->
  <g transform="translate(400 786)">
    <rect width="400" height="70" fill="#151515" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="18" y="26" font-family="ui-monospace, monospace" font-size="10.5" fill="#6e6e6e" letter-spacing="2.4">03 — FINDING CONFLICTS</text>
    <text x="18" y="50" font-family="Georgia, serif" font-size="16" fill="#f2f2f2">conflict-finder · conflict-explainer</text>
    <text x="382" y="50" font-family="ui-monospace, monospace" font-size="11" fill="#2563eb" text-anchor="end">2</text>
  </g>
  <line x1="600" y1="856" x2="600" y2="886" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- review -->
  <g transform="translate(400 886)">
    <rect width="400" height="86" fill="#151515" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="18" y="26" font-family="ui-monospace, monospace" font-size="10.5" fill="#6e6e6e" letter-spacing="2.4">04 — REVIEWING</text>
    <text x="18" y="50" font-family="Georgia, serif" font-size="16" fill="#f2f2f2">statistics · originality · method · evidence</text>
    <text x="18" y="72" font-family="Georgia, serif" font-size="16" fill="#f2f2f2">review-summary arbitrates</text>
    <text x="382" y="50" font-family="ui-monospace, monospace" font-size="11" fill="#2563eb" text-anchor="end">5</text>
  </g>
  <line x1="600" y1="972" x2="600" y2="1002" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- report -->
  <g transform="translate(400 1002)">
    <rect width="400" height="70" fill="#151515" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="18" y="26" font-family="ui-monospace, monospace" font-size="10.5" fill="#6e6e6e" letter-spacing="2.4">05 — WRITING THE REPORT</text>
    <text x="18" y="50" font-family="Georgia, serif" font-size="16" fill="#f2f2f2">confidence-rater · report-writer</text>
    <text x="382" y="50" font-family="ui-monospace, monospace" font-size="11" fill="#2563eb" text-anchor="end">2</text>
  </g>

  <!-- watch -->
  <path d="M800 1037 H960 v-30" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrowBlue)"/>
  <g transform="translate(870 930)">
    <rect width="270" height="76" fill="#101820" stroke="#2563eb" stroke-opacity="0.45"/>
    <text x="16" y="26" font-family="ui-monospace, monospace" font-size="10.5" fill="#2563eb" letter-spacing="2">WATCH · MONTHLY</text>
    <text x="16" y="48" font-family="Georgia, serif" font-size="15" fill="#f2f2f2">change-finder · change-rater</text>
    <text x="16" y="66" font-family="ui-monospace, monospace" font-size="10.5" fill="#7d7d7d">diffs two frozen reports</text>
    <text x="254" y="26" font-family="ui-monospace, monospace" font-size="11" fill="#2563eb" text-anchor="end">2</text>
  </g>

  <!-- footer -->
  <line x1="60" y1="1110" x2="1140" y2="1110" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="60" y="1140" font-family="ui-monospace, monospace" font-size="11" fill="#6e6e6e" letter-spacing="2">24 AGENTS · 18 TOOLS · 6 AGENT-CALLABLE · 1 MCP SERVER</text>
  <text x="1140" y="1140" font-family="ui-monospace, monospace" font-size="11" fill="#6e6e6e" text-anchor="end" letter-spacing="2">OPENALEX · CROSSREF · EUROPE PMC</text>
</svg>
